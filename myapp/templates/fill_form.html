<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Form</title>
    <link rel="stylesheet" href="{% static 'css/fill_form.css' %}">
    
</head>

<body>
    <div class="dashboard-button">
        <a href="{% url 'student_dashboard' %}" class="back-button">Back to Dashboard</a>
    </div>

    <div class="form-container">
        <h1 id="formTitle">Activity Form</h1>
        <div class="subtitle" id="formSubtitle">Enter your event details to claim points</div>

        <form id="activityForm" method="post" action="{% url 'submit_activity_form' %}">
            {% csrf_token %}
            <!-- Common Fields -->
            <div class="form-group">
                <label for="eventTitle">Event Title <span class="required-indicator">*</span></label>
                <input type="text" id="eventTitle" name="eventTitle" required>
            </div>

            <!-- Auto-filled Category -->
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" readonly>
            </div>

            <!-- National Initiatives Fields -->
            <div id="nationalInitiativesFields" class="category-specific">
                <div class="form-group">
                    <label for="eventType">Event Type <span class="required-indicator">*</span></label>
                    <select id="eventType" name="eventType" >
                        <option value="">Select Event Type</option>
                        <option value="NSS">NSS</option>
                        <option value="NCC">NCC</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="additionalActivity">Additional Activity (Optional)</label>
                    <select id="additionalActivity" name="additionalActivity">
                        <option value="">None</option>
                        <option value="outstanding_student">Outstanding Student</option>
                        <option value="best_volunteer_uni">Best NSS Volunteer (University)</option>
                        <option value="nss_camp_uni">NSS Camp (University)</option>
                        <option value="nss_parade_uni">NSS Parade (University)</option>
                        <option value="best_volunteer_state">Best NSS Volunteer (State/National)</option>
                        <option value="nss_camp_state">NSS Camp (State/National)</option>
                        <option value="nss_parade_state">NSS Parade (State/National)</option>
                    </select>
                </div>
            </div>

            <!-- Professional Self Initiatives-->
            <div id="profesionalself" class="category-specific">
                <div class="form-group">
                    <label for="proevent">Event Type <span class="required-indicator">*</span></label>
                    <select id="proevent" name="proevent">
                        <option value="">Select Event Type</option>
                        <option value="mooc">MOOC</option>
                        <option value="Paper presentation/publication at IITs /NITs">Paper presentation/publication at IITs/NITs</option>
                        <option value="Poster Presentationat IITs /NITs">Poster Presentationat IITs /NITs</option>
                        <option value="Industrial Training/Internship (atleast for 5 full days)">Industrial Training/Internship (atleast for 5 full days)</option>
                        <option value="Industrial/Exhibition visits">Industrial/Exhibition visits </option>
                    </select>
                </div>

            </div>

            <!-- Sports & Games Fields -->
            <div id="sportsFields" class="category-specific">
                <div class="form-group">
                    <label for="achievement">Achievement <span class="required-indicator">*</span></label>
                    <select id="achievement" name="achievement">
                        <option value="">Select Achievement</option>
                        <option value="participation">Participation</option>
                        <option value="third">Third Prize</option>
                        <option value="second">Second Prize</option>
                        <option value="first">First Prize</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="zone">Zone <span class="required-indicator">*</span></label>
                    <select id="zone" name="zone">
                        <option value="">Select Zone</option>
                        <option value="college">College</option>
                        <option value="zonal">Zonal</option>
                        <option value="state">State</option>
                        <option value="national">National</option>
                        <option value="international">International</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="additionalActivitySports">Additional Activity (Optional)</label>
                    <input type="text" id="additionalActivitySports" name="additionalActivitySports"
                        placeholder="Describe any additional achievements">
                </div>
            </div>

            <!-- Cultural Activities Fields -->
            <div id="culturalFields" class="category-specific">
                <div class="form-group">
                    <label for="culturalAchievement">Achievement <span class="required-indicator">*</span></label>
                    <select id="culturalAchievement" name="culturalAchievement">
                        <option value="">Select Achievement</option>
                        <option value="participation">Participation</option>
                        <option value="third">Third Prize</option>
                        <option value="second">Second Prize</option>
                        <option value="first">First Prize</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="culturalZone">Zone <span class="required-indicator">*</span></label>
                    <select id="culturalZone" name="culturalZone">
                        <option value="">Select Zone</option>
                        <option value="college">College</option>
                        <option value="zonal">Zonal</option>
                        <option value="state">State</option>
                        <option value="national">National</option>
                        <option value="international">International</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="additionalActivityCultural">Additional Activity (Optional)</label>
                    <input type="text" id="additionalActivityCultural" name="additionalActivityCultural"
                        placeholder="Describe any additional achievements">
                </div>
            </div>


            <!-- Entrepreneurship & Innovation Fields -->
            <div id="entrepreneurshipFields" class="category-specific">
                <div class="form-group">
                    <label for="achievement">Achievement <span class="required-indicator">*</span></label>
                    <select id="entrepreneurshipAchievement" name="achievement" >
                        <option value="">Select Achievement</option>
                        <option value="Foreign Language Skill">Foreign Language Skill (TOEFL/IELTS/BEC exams etc) </option>
                        <option value="Start-up Company-Registered legally">Start-up Company-Registered legally </option>
                        <option value="Patent-Filed">Patent-Filed </option>
                        <option value="Patent-Published">Patent- Published </option>
                        <option value="Patent-Approved">Patent- Approved   </option>
                        <option value="Patent-Licensed">Patent- Licensed  </option>
                        <option value="Prototype developed and tested">Prototype developed and tested </option>
                        <option value="Awards for Products developed">Awards for Products developed </option>
                        <option value="Innovative technologies developed and used by industries/users">Innovative technologies developed and used by industries/users </option>
                        <option value="Got venture capital funding for innovative ideas/products">Got venture capital funding for innovative ideas/products </option>
                        <option value="Startup Employment">Startup Employment (Offering jobs to two persons not less than Rs. 15000/- per month)</option>
                        <option value="Societal innovations">Societal innovations </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="additionalActivity">Additional Details (Optional)</label>
                    <input type="text" id="additionalActivityEntrepreneurship" name="additionalActivity"
                        placeholder="Provide additional details about your achievement">
                </div>
            </div>

            <!-- Leadership & Management -->
            <div id="leadership" class="category-specific">
                <div class="form-group">
                    <label for="leadertype">Event Type <span class="required-indicator">*</span></label>
                    <select id="leadertype" name="leadertype">
                        <option value="">Select Event Type</option>
                        <option value="studentProfessionalSocieties">Student Professional Societies (IEEE,IET, ASME, SAE,NASA etc.)</option>
                        <option value="collegeAssociationChapters">College Association Chapters(Mechanical, Civil,Electrical etc.)</option>
                        <option value="festivalTechnicalEvents">Festival & Technical Events(College approved)</option>
                        <option value="hobbyClubs">Hobby Clubs</option>
                        <option value="electedstudentrepresentatives">Elected student representatives</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="pos">Position <span class="required-indicator">*</span></label>
                    <select id="pos" name="pos">
                        <option value="">Select Position</option>
                        <option value="corecoordinator">core coordinator</option>
                        <option value="subcoordinator">sub coordinator</option>
                        <option value="volunteer">Volunteer</option>
                        
                    </select>
                </div>
            </div>


            <!-- Points Field -->
            <div class="form-group">
                <label for="points">Points <span class="required-indicator">*</span></label>
                <input type="number" id="points" name="points" readonly required>
            </div>

            <!-- Certificate Upload Section -->
            <div class="form-group">
                <label>Upload Certificates <span class="required-indicator">*</span></label>
                <div id="certificateContainer">
                    <div class="file-input-container">
                        <input type="file" name="certificates" required>
                        <button type="button" class="remove-btn" style="display:none;">Remove</button>
                    </div>
                </div>
                <button type="button" class="add-more-btn" id="addMoreCertificates">Add More Certificates</button>
            </div>

            <div class="form-group">
                <button type="submit" id="submitButton">Submit</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get category from URL
            const category = "{{ category|escapejs }}";
            const form = document.getElementById('activityForm');
            const dynamicFields = document.getElementById('dynamicFields');

            console.log(category);

            // Set category field and title
            document.getElementById('category').value = category;
            document.getElementById('formTitle').textContent = category;
            document.getElementById('formSubtitle').textContent = `${category} - Enter your event details`;

            // Hide all category-specific fields first
            document.querySelectorAll('.category-specific').forEach(el => {
                el.style.display = 'none';
            });

            // Show relevant fields based on category
            switch (category) {
                case 'National Initiatives':
                const nationalFields = document.getElementById('nationalInitiativesFields');
                    if (nationalFields) {
                        nationalFields.style.display = 'block';
                        setTimeout(setupNationalInitiativesLogic, 100); // Delay setup to ensure element is available
                    }
                    break;  
                case 'Sports & Games':
                    document.getElementById('sportsFields').style.display = 'block';
                    setupSportsLogic();
                    break;
                case 'Cultural Activities':
                    document.getElementById('culturalFields').style.display = 'block';
                    setupCulturalLogic();
                    break;
                case 'Professional Self Initiatives':
                    document.getElementById('profesionalself').style.display = 'block';
                    setupProfessionalLogic();
                    break;
                case 'Leadership & Management':
                    document.getElementById('leadership').style.display = 'block';
                    setupLeaderLogic();
                    break;
                case 'Entrepreneurship & Innovation':
                    document.getElementById('entrepreneurshipFields').style.display = 'block';
                    
                    setupEntrepreneurshipLogic();
                    break;    
            }

            setupCommonLogic();
        });

        function setupNationalInitiativesLogic() {
    const eventType = document.getElementById('eventType');
    const additionalActivity = document.getElementById('additionalActivity');
    const pointsField = document.getElementById('points');

    if (!eventType || !additionalActivity || !pointsField) {
        console.warn("One or more elements not found for National Initiatives.");
        return;
    }

    // Initialize points calculation
    updatePoints();

    // Set up event listeners safely
    eventType.addEventListener('change', updatePoints);
    additionalActivity.addEventListener('change', updatePoints);

    function updatePoints() {
        let points = 0;

        // Base points for NSS/NCC
        if (eventType.value === 'NSS' || eventType.value === 'NCC') {
            points = 60;
        }

        // Additional points for activities
        switch (additionalActivity.value) {
            case 'outstanding_student':
            case 'best_volunteer_state':
            case 'nss_camp_state':
            case 'nss_parade_state':
                points += 20;
                break;
            case 'best_volunteer_uni':
            case 'nss_camp_uni':
            case 'nss_parade_uni':
                points += 10;
                break;
        }

        pointsField.value = points;
    }
}

        function setupSportsLogic() {
            const achievement = document.getElementById('achievement');
            const zone = document.getElementById('zone');
            const pointsField = document.getElementById('points');

            // Initialize points calculation
            updatePoints();

            // Set up event listeners
            achievement.addEventListener('change', updatePoints);
            zone.addEventListener('change', updatePoints);

            function updatePoints() {
                const achievementValue = achievement.value;
                const zoneValue = zone.value;
                let points = 0;

                const pointMatrix = {
                    participation: {
                        college: 8,
                        zonal: 15,
                        state: 25,
                        national: 40,
                        international: 60
                    },
                    third: {
                        college: 13,
                        zonal: 20,
                        state: 30,
                        national: 52,
                        international: 72
                    },
                    second: {
                        college: 16,
                        zonal: 22,
                        state: 33,
                        national: 56,
                        international: 76
                    },
                    first: {
                        college: 18,
                        zonal: 25,
                        state: 35,
                        national: 60,
                        international: 80
                    }
                };

                if (achievementValue && zoneValue) {
                    points = pointMatrix[achievementValue][zoneValue] || 0;
                }

                pointsField.value = points;
            }
        }

        function setupCulturalLogic() {
            const achievement = document.getElementById('culturalAchievement');
            const zone = document.getElementById('culturalZone');
            const pointsField = document.getElementById('points');

            // Initialize points calculation
            updatePoints();

            // Set up event listeners
            achievement.addEventListener('change', updatePoints);
            zone.addEventListener('change', updatePoints);

            function updatePoints() {
                const achievementValue = achievement.value;
                const zoneValue = zone.value;
                let points = 0;

                const pointMatrix = {
                    participation: {
                        college: 8,
                        zonal: 15,
                        state: 25,
                        national: 40,
                        international: 60
                    },
                    third: {
                        college: 13,
                        zonal: 20,
                        state: 30,
                        national: 52,
                        international: 72
                    },
                    second: {
                        college: 16,
                        zonal: 22,
                        state: 33,
                        national: 56,
                        international: 76
                    },
                    first: {
                        college: 18,
                        zonal: 25,
                        state: 35,
                        national: 60,
                        international: 80
                    }
                };

                if (achievementValue && zoneValue) {
                    points = pointMatrix[achievementValue][zoneValue] || 0;
                }

                pointsField.value = points;
            }
        }
        function setupEntrepreneurshipLogic() {
    const achievement = document.getElementById('entrepreneurshipAchievement');
    const pointsField = document.getElementById('points');

    // Points mapping
    const pointsMap = {
        'Foreign Language Skill': 50,
        'Start-up Company-Registered legally': 60,
        'Patent-Filed': 30,
        'Patent-Published': 35,
        'Patent-Approved': 50,
        'Patent-Licensed': 80,
        'Prototype developed and tested': 60,
        'Awards for Products developed': 60,
        'Innovative technologies developed and used by industries/users': 60,
        'Got venture capital funding for innovative ideas/products': 80,
        'Startup Employment': 80,
        'Societal innovations': 50
    };

    // Initialize points calculation
    updatePoints();

    // Set up event listener
    achievement.addEventListener('change', updatePoints);

    function updatePoints() {
        const selectedAchievement = achievement.value;
        const points = pointsMap[selectedAchievement] || 0;
        pointsField.value = points;
    }
}

function setupProfessionalLogic() {
    const achievement = document.getElementById('proevent');
    const pointsField = document.getElementById('points');

    // Points mapping
    const pointsMap = {
        'mooc': 50,
        'Paper presentation/publication at IITs /NITs': 30,
        'Poster Presentationat IITs /NITs': 20,
        'Industrial Training/Internship (atleast for 5 full days)': 20,
        'Industrial/Exhibition visits': 5
    };

    // Initialize points calculation
    updatePoints();

    // Set up event listener
    achievement.addEventListener('change', updatePoints);

    function updatePoints() {
        const selectedAchievement = achievement.value;
        const points = pointsMap[selectedAchievement] || 0;
        pointsField.value = points;
    }
}


function setupLeaderLogic() {
            const achievement = document.getElementById('leadertype');
            const zone = document.getElementById('pos');
            const pointsField = document.getElementById('points');

            // Initialize points calculation
            updatePoints();

            // Set up event listeners
            achievement.addEventListener('change', updatePoints);
            zone.addEventListener('change', updatePoints);

            function updatePoints() {
                const achievementValue = achievement.value;
                const zoneValue = zone.value;
                let points = 0;

                const pointMatrix = {
                    studentProfessionalSocieties: {
                        corecoordinator: 15,
                        subcoordinator: 10,
                        volunteer: 5
                    },
                    collegeAssociationChapters: {
                        corecoordinator: 15,
                        subcoordinator: 10,
                        volunteer: 5
                    },
                    festivalTechnicalEvents: {
                        corecoordinator: 15,
                        subcoordinator: 10,
                        volunteer: 5
                    },
                    hobbyClubs: {
                        corecoordinator: 15,
                        subcoordinator: 10,
                        volunteer: 5
                    },
                    electedstudentrepresentatives: {
                        corecoordinator: 30,
                        subcoordinator: 25,
                        volunteer: 15
                    }
                };

                if (achievementValue && zoneValue) {
                    points = pointMatrix[achievementValue][zoneValue] || 0;
                }

                pointsField.value = points;
            }
        }

        function setupCommonLogic() {
            const addMoreBtn = document.getElementById('addMoreCertificates');
            const certificateContainer = document.getElementById('certificateContainer');

            addMoreBtn.addEventListener('click', function () {
                const newInputDiv = document.createElement('div');
                newInputDiv.className = 'file-input-container';
                newInputDiv.innerHTML = `
                    <input type="file" name="certificates[]" required>
                    <button type="button" class="remove-btn">Remove</button>
                `;
                certificateContainer.appendChild(newInputDiv);

                const fileContainers = certificateContainer.querySelectorAll('.file-input-container');
                if (fileContainers.length > 1) {
                    fileContainers[0].querySelector('.remove-btn').style.display = 'block';
                }

                newInputDiv.querySelector('.remove-btn').addEventListener('click', function () {
                    certificateContainer.removeChild(newInputDiv);

                    const remainingContainers = certificateContainer.querySelectorAll('.file-input-container');
                    if (remainingContainers.length === 1) {
                        remainingContainers[0].querySelector('.remove-btn').style.display = 'none';
                    }
                });
            });

            document.getElementById('activityForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const fileInputs = document.querySelectorAll('input[type="file"]');
                let hasFiles = false;

                fileInputs.forEach(input => {
                    if (input.files.length > 0) {
                        hasFiles = true;
                    }
                });

                if (!hasFiles) {
                    alert('Please upload at least one certificate');
                    return false;
                }
                const formData = new FormData(this);
                fetch(this.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                    },
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Form submitted successfully!');
                            window.location.href = "{% url 'student_dashboard' %}";  // Redirect to dashboard
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Submission failed. Please try again.');
                    });
            });
        }
    </script>
</body>

</html>
