{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - ActiPoints</title>
    <link rel="stylesheet" href="{% static 'css/student_events.css' %}"> 
</head>
<body>
<!-- Menu Icon and ActiPoints Title -->
<div class="actipoints-1">
    <div class="menu-icon-1" onclick="toggleMenu()">☰</div> <!-- Menu open/close button -->
    ActiPoints
</div>

<!-- Top Right Icons (Bell and Logout) -->
<div class="top-right-icons">
   
    <div class="logout-button">
        <a href="{% url 'faculty_dashboard' %}" class="button-11">Back to dashboard</a>
    </div>
</div>


    <!-- Context Area (Events) -->
    <div class="context-area">
        <div class="events-list">
            <h2>Upcoming Events</h2>
            <div class="event-posters">
                {% for event in events %}
                    <div class="event-poster">
                        <img src="{{ event.poster.url }}" alt="{{ event.title }}">
                        <h4>{{ event.title }}</h4>
                        <p>{{ event.description }}</p>
                        <p>Date: {{ event.date }}</p>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<script>
    // Function to toggle menu visibility
    function toggleMenu() {
        const menuOptions = document.getElementById('menuOptions');
        if (menuOptions.style.display === 'none') {
            menuOptions.style.display = 'flex';
        } else {
            menuOptions.style.display = 'none';
        }
    }
</script>
</body>
</html>
