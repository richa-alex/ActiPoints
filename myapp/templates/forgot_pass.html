{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/student_login.css' %}">
</head>
<body>
    <div class="content">
        <h2>Reset Your Password</h2>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter your email" required class="text-area-1"><br>
            <input type="password" name="new_password" placeholder="Enter new password" required class="text-area-2"><br>
            <input type="password" name="confirm_password" placeholder="Confirm new password" required class="text-area-2"><br>
            <button type="submit" class="button-11">Reset Password</button>
        </form>

        {% if messages %}
            <div class="error-messages">
                {% for message in messages %}
                    <div style="color: red;">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
